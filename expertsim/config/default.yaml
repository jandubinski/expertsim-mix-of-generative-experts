config:
  run_name: "expertsim_train_run"  # name of the training run
wandb:
  log_experiments: False  # to initiate wandb session
  plot_images: False  # plot images to wand
  api_key: ""  # insert api key

model:
  architecture: "proton"
  n_experts: 3
  noise_dim: 10
  cond_dim: 9  # number of conditional values found in DATA_COND_PATH
  generator:
    lr_g: 1e-4
    di_strength: 1e-1
    in_strength: 1e-3
  discriminator:
    lr_d: 1e-5
  aux_reg:
    lr_a: 1e-4
    strength: 1e-3
  router:
    version: "router_v1"
    lr_r: 1e-2
    n_experts: 3
    ed_strength: 0 # Strength on the expert distribution loss in the router loss calculation
    gan_strength: 1e-1  # Strength on the generator loss in the router loss calculation
    diff_strength: 1e-1  # Strength of the differentiation on the generator loss in the router loss calculation
    util_strength: 0  #  1e-4  # Strength on the expert utilization entropy in the router loss calculation
    alb_strength: 1e-7  # 1e-3  #1e-4  # Strength on the adaptive load balancing in the router loss calculation
    stop_router_training_epoch: null  # null if router should be trained until the end of the training
  
dataset:
  zdc_type: "proton"  # proton or neutron
  DATA_IMAGES_PATH: "data/data_proton_photonsum_proton_1_2312.pkl"  # path to the images data file
  DATA_COND_PATH: "data/data_cond_photonsum_proton_1_2312.pkl"
  DATA_POSITIONS_PATH: "data/data_coord_photonsum_proton_1_2312.pkl"
  input_image_shape: [56, 30]
  MIN_INTENSITY_THRESHOLD: 1  # threshold for minimum intensity of the image pixels.
  MAX_INTENSITY_THRESHOLD: null
  read_n_samples: null  # None means all samples
  shuffle_train_test_split: True
  test_size: 0.2

train:
  batch_size: 512
  epochs: 150
  ws_threshold_model_save: 2  # wasserstein distance threshold for saving the model
  save_experiment_data: False
  save_experiments_dir: "experiments/"  # main directory with all experiments

  # checkpoint info. Load existing training files to continue training
  checkpoint_experiment_dir: null # absolute path to the experiment folder containing dir models/ and info/ or None
  epoch_to_load: null # epoch number or None
